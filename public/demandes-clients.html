<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Demandes clients — STOCKFLOW</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sf.css">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('stockflow-theme') === 'dark' ? 'dark' : 'light'); try { var sfu = JSON.parse(localStorage.getItem('stockflow-ui') || '{}'); for (var k in sfu) document.documentElement.setAttribute('data-' + k, sfu[k]); } catch (e) {}</script>
    <style>
        .rq-top { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; margin-bottom:18px; }
        .rq-panel { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--border-radius-lg); padding:14px 16px; min-width:0; }
        .rq-panel h3 { font-size:14px; margin:0; display:flex; align-items:center; gap:8px; }
        .rq-panel-h { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
        .rq-panel-h select { width:auto; min-width:0; padding:6px 28px 6px 10px; font-size:12.5px; }
        .rq-ctl { display:flex; gap:6px; flex-wrap:wrap; }
        .rq-rank { display:flex; flex-direction:column; gap:4px; }
        .rq-row { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 8px; border-radius:8px; cursor:pointer; }
        .rq-row:hover, .rq-row.on { background:var(--bg-input); }
        .rq-row .n { font-weight:800; color:var(--text-muted); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
        .rq-row .lbl { font-weight:700; font-size:13px; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rq-row .bar { height:5px; border-radius:3px; background:var(--accent); margin-top:4px; opacity:.85; }
        .rq-row .meta { font-size:11.5px; color:var(--text-muted); margin-top:2px; }
        .rq-row .cnt { font-size:18px; font-weight:800; color:var(--text-primary); font-variant-numeric:tabular-nums; text-align:right; line-height:1; }
        .rq-row .cnt small { display:block; font-size:10px; font-weight:600; color:var(--text-muted); }
        .rq-chips { display:flex; flex-wrap:wrap; gap:6px; }
        .rq-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; border:1px solid var(--border-color); background:var(--bg-card); font-size:12.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; }
        .rq-chip b { font-size:11px; background:var(--bg-input); color:var(--text-primary); border-radius:999px; padding:0 6px; }
        .rq-chip.on { border-color:var(--accent); background:var(--accent-glow); color:var(--text-primary); }
        .rq-empty { color:var(--text-muted); font-size:13px; padding:14px 4px; text-align:center; }
        .rq-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
        .rq-bar .tabs { margin-bottom:0; }
        .search-box { position:relative; flex:1; min-width:200px; }
        .search-box i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
        .search-box input { width:100%; min-height:40px; padding:9px 14px 9px 40px; background:var(--bg-input); border:1px solid var(--border-color); border-radius:var(--border-radius); color:var(--text-primary); font-size:14px; }
        .search-box input:focus { outline:none; border-color:var(--accent); background:var(--bg-card); }
        .rq-filter { display:none; align-items:center; gap:8px; font-size:12.5px; margin:-4px 0 12px; color:var(--text-secondary); }
        .rq-filter.show { display:flex; }
        .rq-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
        .rq-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--border-radius-lg); padding:14px; display:flex; flex-direction:column; gap:8px; }
        .rq-card[data-st="disponible"] { border-left:4px solid var(--success); }
        .rq-card[data-st="en_attente"] { border-left:4px solid var(--warning); }
        .rq-card-h { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
        .rq-prod { font-weight:800; font-size:14.5px; color:var(--text-primary); line-height:1.3; word-break:break-word; }
        .rq-qty { font-size:12px; font-weight:800; background:var(--bg-input); border-radius:6px; padding:1px 7px; margin-left:4px; white-space:nowrap; }
        .rq-meta { font-size:12.5px; color:var(--text-secondary); line-height:1.6; }
        .rq-meta i { width:15px; color:var(--text-muted); }
        .rq-note { font-size:12.5px; color:var(--text-secondary); background:var(--bg-input); border-radius:8px; padding:6px 9px; }
        .rq-match { font-size:12.5px; border-radius:8px; padding:7px 10px; background:#e8f5ee; color:#0f6b46; font-weight:600; }
        :root[data-theme="dark"] .rq-match { background:rgba(47,165,122,.16); color:#5cc9a3; }
        .rq-acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
        .rq-st { font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; white-space:nowrap; }
        .rq-st.en_attente { background:#fdf0e1; color:#9a4a00; }
        .rq-st.disponible { background:#e8f5ee; color:#0f6b46; }
        .rq-st.commandee { background:#e6f0fb; color:#1d4f91; }
        .rq-st.abandonnee { background:var(--bg-input); color:var(--text-muted); }
        :root[data-theme="dark"] .rq-st.en_attente { background:rgba(224,160,70,.16); color:#e8b15f; }
        :root[data-theme="dark"] .rq-st.disponible { background:rgba(47,165,122,.16); color:#5cc9a3; }
        :root[data-theme="dark"] .rq-st.commandee { background:rgba(80,140,220,.18); color:#8fb8ee; }
        .rq-time { font-size:11.5px; color:var(--text-muted); }
        @media (max-width:900px) { .rq-top { grid-template-columns:minmax(0,1fr); } }
        @media (max-width:768px) {
            .rq-grid { grid-template-columns:minmax(0,1fr); }
            .rq-bar .tabs { max-width:100%; }
            .search-box { flex-basis:100%; }
            .search-box input { font-size:16px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sfSidebar"></aside>
        <main class="main-content">
            <header class="page-header">
                <div class="page-title"><h1>Demandes clients</h1><p id="sub"></p></div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="newBtn" style="display:none;" onclick="Rq.openForm()"><i class="fas fa-plus"></i> Nouvelle demande</button>
                    <div id="sfTools"></div>
                </div>
            </header>
            <div class="page-body">
                <div class="rq-top">
                    <div class="rq-panel">
                        <div class="rq-panel-h">
                            <h3><i class="fas fa-ranking-star"></i> Les plus demandés</h3>
                            <div class="rq-ctl">
                                <select id="a_status" class="form-control" onchange="Rq.loadAnalysis()">
                                    <option value="en_attente">À commander</option>
                                    <option value="all">Toutes les demandes</option>
                                </select>
                                <select id="a_days" class="form-control" onchange="Rq.loadAnalysis()">
                                    <option value="7">7 jours</option>
                                    <option value="30" selected>30 jours</option>
                                    <option value="90">90 jours</option>
                                    <option value="0">Tout</option>
                                </select>
                            </div>
                        </div>
                        <div class="rq-rank" id="rank"></div>
                    </div>
                    <div class="rq-panel">
                        <div class="rq-panel-h"><h3><i class="fas fa-tags"></i> Mots-clés fréquents</h3></div>
                        <div class="rq-chips" id="chips"></div>
                    </div>
                </div>

                <div class="rq-bar">
                    <div class="tabs" id="stTabs"></div>
                    <div class="search-box"><i class="fas fa-search"></i><input type="text" id="q" placeholder="Produit, client, contact, commercial…" oninput="Rq.onSearch()"></div>
                </div>
                <div class="rq-filter" id="groupFilter"><i class="fas fa-filter"></i> <span id="groupLabel"></span> <button class="btn btn-sm btn-secondary" onclick="Rq.clearGroup()"><i class="fas fa-times"></i> Retirer le filtre</button></div>
                <div id="list"><div class="sf-skel sf-skel-card"></div><div class="sf-skel sf-skel-card"></div></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="formModal">
        <div class="modal" style="max-width:520px;">
            <div class="modal-header"><h3 id="formTitle">Nouvelle demande</h3><button class="modal-close" onclick="SF.Modal.close('formModal')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Produit recherché <span style="color:var(--danger);">*</span></label><input type="text" id="f_product" class="form-control" placeholder="Ex : HP EliteBook 840 G5 i5 8 Go"></div>
                <div class="form-row">
                    <div class="form-group"><label>Client <span style="color:var(--danger);">*</span></label><input type="text" id="f_client" class="form-control" placeholder="Nom du client"></div>
                    <div class="form-group"><label>Contact <span class="req" style="color:var(--danger);">*</span></label><input type="text" id="f_phone" class="form-control" inputmode="tel" placeholder="034 12 345 67"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Réseau</label>
                        <select id="f_channel" class="form-control">
                            <option value="facebook">Facebook</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="tiktok">TikTok</option>
                            <option value="instagram">Instagram</option>
                            <option value="telephone">Téléphone</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Quantité</label><input type="number" id="f_qty" class="form-control" min="1" value="1" inputmode="numeric"></div>
                </div>
                <div class="form-group"><label>Budget du client (Ar)</label><input type="text" id="f_budget" class="form-control money-input" inputmode="numeric" placeholder="Facultatif"></div>
                <div class="form-group"><label>Remarque</label><textarea id="f_note" class="form-control" rows="2" placeholder="Couleur, état souhaité, délai…"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="SF.Modal.close('formModal')">Annuler</button>
                <button class="btn btn-primary" id="saveBtn" onclick="Rq.save()"><i class="fas fa-check"></i> Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="/js/sf-core.js"></script>
    <script src="/js/sf-layout.js"></script>
    <script>
    const Rq = {
        user: null, all: false, mine: false, list: [], status: 'en_attente', group: null, editId: null,
        ST: { en_attente: 'En attente', disponible: 'Disponible', commandee: 'Commandée', abandonnee: 'Abandonnée' },
        CH: { facebook: 'fa-brands fa-facebook', whatsapp: 'fa-brands fa-whatsapp', tiktok: 'fa-brands fa-tiktok', instagram: 'fa-brands fa-instagram', telephone: 'fas fa-phone', autre: 'fas fa-comment' },
        CHL: { facebook: 'Facebook', whatsapp: 'WhatsApp', tiktok: 'TikTok', instagram: 'Instagram', telephone: 'Téléphone', autre: 'Autre' },
        async init() {
            this.user = await SF.Auth.require([]);
            if (!this.user) return;
            const roles = (Array.isArray(this.user.roles) && this.user.roles.length) ? this.user.roles : [this.user.role];
            this.mine = roles.includes('commercial_ligne');
            this.admin = this.user.role === 'admin';
            if (!this.admin && !this.mine && !this.user.commande_responsible) {
                SF.toast('Accès non autorisé pour votre rôle', 'error');
                return setTimeout(() => location.href = this.user.home || '/index.html', 800);
            }
            SF.layout({ active: '/demandes-clients.html' });
            document.getElementById('newBtn').style.display = (this.mine || this.admin) ? '' : 'none';
            // Responsable commande : par défaut les besoins à commander ; commercial : ce qu'il peut vendre.
            SF.on('client-request:update', () => { this.load(); this.loadAnalysis(); });
            SF.on('reception:new', () => setTimeout(() => { this.load(); this.loadAnalysis(); }, 800));
            await this.load();
            if (this.mine && this.list.some(r => r.status === 'disponible')) this.status = 'disponible';
            this.renderTabs(); this.render();
            this.loadAnalysis();
        },
        async load() {
            try { const r = await SF.api('/api/client-requests'); this.all = r.can_see_all; this.list = r.requests; }
            catch (e) { return SF.toast(e.message, 'error'); }
            const att = this.list.filter(r => r.status === 'en_attente').length, dispo = this.list.filter(r => r.status === 'disponible').length;
            document.getElementById('sub').textContent = `${att} en attente · ${dispo} disponible${dispo > 1 ? 's' : ''}`;
            this.renderTabs(); this.render();
        },
        async loadAnalysis() {
            const qs = new URLSearchParams({ days: document.getElementById('a_days').value, status: document.getElementById('a_status').value });
            let a;
            try { a = await SF.api('/api/client-requests-analysis?' + qs); } catch (e) { return; }
            this.analysis = a;
            const max = Math.max(1, ...a.products.map(p => p.requests));
            document.getElementById('rank').innerHTML = a.products.length ? a.products.slice(0, 10).map((p, i) => `
                <div class="rq-row ${this.group && this.group.label === p.label ? 'on' : ''}" onclick="Rq.pickGroup(${i})">
                    <div class="n">${i + 1}</div>
                    <div style="min-width:0;"><div class="lbl" title="${SF.esc(p.label)}">${SF.esc(p.label)}</div>
                        <div class="bar" style="width:${Math.max(6, Math.round(p.requests / max * 100))}%;"></div>
                        <div class="meta">${p.quantity} pièce${p.quantity > 1 ? 's' : ''} · ${p.clients} client${p.clients > 1 ? 's' : ''} · ${SF.fmt.relative(p.last_at)}</div></div>
                    <div class="cnt">${p.requests}<small>demande${p.requests > 1 ? 's' : ''}</small></div>
                </div>`).join('') : '<div class="rq-empty">Aucune demande sur cette période.</div>';
            const q = (document.getElementById('q').value || '').trim().toLowerCase();
            document.getElementById('chips').innerHTML = a.keywords.length ? a.keywords.map(k =>
                `<span class="rq-chip ${q === k.k ? 'on' : ''}" onclick="Rq.pickKeyword('${SF.esc(k.k).replace(/'/g, "\\'")}')">${SF.esc(k.k)} <b>${k.n}</b></span>`).join('')
                : '<div class="rq-empty">Pas encore de mot-clé récurrent.</div>';
        },
        pickGroup(i) {
            const p = this.analysis.products[i];
            this.group = (this.group && this.group.label === p.label) ? null : { label: p.label, ids: new Set(p.ids) };
            if (this.group) this.status = 'all';
            this.renderTabs(); this.render(); this.loadAnalysis();
        },
        clearGroup() { this.group = null; this.render(); this.loadAnalysis(); },
        pickKeyword(k) {
            const el = document.getElementById('q');
            el.value = el.value.trim().toLowerCase() === k ? '' : k;
            this.status = 'all'; this.renderTabs(); this.render(); this.loadAnalysis();
        },
        onSearch() { clearTimeout(this._t); this._t = setTimeout(() => this.render(), 150); },
        setStatus(s) { this.status = s; this.renderTabs(); this.render(); },
        renderTabs() {
            const n = s => this.list.filter(r => r.status === s).length;
            const tabs = [['en_attente', 'En attente', 'fa-hourglass-half'], ['disponible', 'Disponibles', 'fa-circle-check'], ['commandee', 'Commandées', 'fa-truck-fast'], ['abandonnee', 'Abandonnées', 'fa-ban'], ['all', 'Toutes', 'fa-list']];
            document.getElementById('stTabs').innerHTML = tabs.map(([k, l, ic]) => {
                const c = k === 'all' ? this.list.length : n(k);
                return `<div class="tab ${this.status === k ? 'active' : ''}" onclick="Rq.setStatus('${k}')"><i class="fas ${ic}"></i> ${l}${c && k !== 'all' ? ` <span class="badge-n" style="border-radius:999px;padding:0 6px;font-size:11px;">${c}</span>` : ''}</div>`;
            }).join('');
        },
        // Recherche : chaque mot doit apparaître (sans accents ni casse).
        norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); },
        filtered() {
            const words = this.norm(document.getElementById('q').value).split(/\s+/).filter(Boolean);
            return this.list.filter(r => {
                if (this.group) { if (!this.group.ids.has(r.id)) return false; }
                else if (this.status !== 'all' && r.status !== this.status) return false;
                if (!words.length) return true;
                const hay = this.norm([r.product_text, r.client_name, r.client_phone, r.commercial_name, r.note, r.matched_product_name].join(' '));
                return words.every(w => hay.includes(w));
            });
        },
        card(r) {
            const own = this.admin || (this.mine && r.commercial_id === this.user.id);
            const acts = [];
            if (own) {
                if (r.status === 'disponible') acts.push(`<a class="btn btn-sm btn-primary" href="/online.html?request=${r.id}"><i class="fas fa-cart-plus"></i> Commander</a>`);
                if (['en_attente', 'disponible'].includes(r.status)) {
                    acts.push(`<button class="btn btn-sm btn-secondary" onclick="Rq.openForm(${r.id})"><i class="fas fa-pen"></i> Modifier</button>`);
                    acts.push(`<button class="btn btn-sm btn-secondary" onclick="Rq.setReqStatus(${r.id}, 'commandee')"><i class="fas fa-check"></i> Commandée</button>`);
                    acts.push(`<button class="btn btn-sm btn-secondary" onclick="Rq.setReqStatus(${r.id}, 'abandonnee')"><i class="fas fa-ban"></i> Abandonner</button>`);
                } else acts.push(`<button class="btn btn-sm btn-secondary" onclick="Rq.setReqStatus(${r.id}, 'en_attente')"><i class="fas fa-rotate-left"></i> Remettre en attente</button>`);
            }
            const ch = r.channel && this.CH[r.channel];
            return `<div class="rq-card" data-st="${SF.esc(r.status)}">
                <div class="rq-card-h"><div class="rq-prod">${SF.esc(r.product_text)}${r.quantity > 1 ? `<span class="rq-qty">×${r.quantity}</span>` : ''}</div><span class="rq-st ${SF.esc(r.status)}">${this.ST[r.status] || r.status}</span></div>
                <div class="rq-meta">
                    <i class="fas fa-user"></i> ${SF.esc(r.client_name || '—')}${r.client_phone ? ' · ' + SF.esc(r.client_phone) : ''}<br>
                    ${ch ? `<i class="${ch}"></i> ${this.CHL[r.channel]}` : ''}${r.budget ? `${ch ? ' · ' : ''}<i class="fas fa-wallet"></i> ${SF.fmt.ar(r.budget)}` : ''}${(ch || r.budget) ? '<br>' : ''}
                    ${this.all ? `<i class="fas fa-headset"></i> ${SF.esc(r.commercial_name || '—')} · ` : ''}<span class="rq-time">${SF.fmt.datetime(r.created_at)}</span>
                </div>
                ${r.note ? `<div class="rq-note">${SF.esc(r.note)}</div>` : ''}
                ${r.matched_product_name ? `<div class="rq-match"><i class="fas fa-box-open"></i> ${SF.esc(r.matched_product_name)} — ${r.matched_source === 'reception' ? 'reçu' : 'en stock'} le ${SF.fmt.datetime(r.matched_at)}</div>` : ''}
                ${acts.length ? `<div class="rq-acts">${acts.join('')}</div>` : ''}
            </div>`;
        },
        render() {
            const gf = document.getElementById('groupFilter');
            gf.classList.toggle('show', !!this.group);
            if (this.group) document.getElementById('groupLabel').textContent = `Produit : ${this.group.label}`;
            const items = this.filtered();
            document.getElementById('list').innerHTML = items.length ? `<div class="rq-grid">${items.map(r => this.card(r)).join('')}</div>`
                : `<div class="rq-empty" style="padding:34px 10px;">${this.list.length ? 'Aucune demande ne correspond.' : 'Aucune demande pour le moment.'}</div>`;
        },
        openForm(id) {
            const r = id ? this.list.find(x => x.id === id) : null;
            this.editId = r ? r.id : null;
            document.getElementById('formTitle').textContent = r ? 'Modifier la demande' : 'Nouvelle demande';
            document.getElementById('f_product').value = r ? r.product_text || '' : '';
            document.getElementById('f_client').value = r ? r.client_name || '' : '';
            document.getElementById('f_phone').value = r ? r.client_phone || '' : '';
            document.getElementById('f_channel').value = (r && r.channel) || 'facebook';
            document.getElementById('f_qty').value = r ? r.quantity || 1 : 1;
            document.getElementById('f_budget').value = r && r.budget ? SF.money.group(r.budget) : '';
            document.getElementById('f_note').value = r ? r.note || '' : '';
            SF.Modal.open('formModal');
            setTimeout(() => document.getElementById('f_product').focus(), 50);
        },
        async save() {
            const body = {
                product_text: document.getElementById('f_product').value.trim(),
                client_name: document.getElementById('f_client').value.trim(),
                client_phone: document.getElementById('f_phone').value.trim(),
                channel: document.getElementById('f_channel').value,
                quantity: document.getElementById('f_qty').value,
                budget: SF.money.val(document.getElementById('f_budget')) || 0,
                note: document.getElementById('f_note').value.trim()
            };
            if (!body.product_text) return SF.toast('Produit recherché requis', 'warn');
            { const err = SF.clientError(body.client_name, body.client_phone); if (err) return SF.toast(err, 'warn'); }
            const btn = document.getElementById('saveBtn'); btn.disabled = true;
            try {
                if (this.editId) {
                    await SF.api('/api/client-requests/' + this.editId, { method: 'PUT', body });
                    SF.toast('Demande modifiée', 'success');
                } else {
                    const r = await SF.api('/api/client-requests', { method: 'POST', body });
                    if (r.in_stock) SF.toast(`Déjà disponible : ${r.in_stock.name}`, 'success', 5000);
                    else SF.toast('Demande enregistrée', 'success');
                }
                SF.Modal.close('formModal');
                await this.load(); this.loadAnalysis();
            } catch (e) { SF.toast(e.message, 'error'); }
            btn.disabled = false;
        },
        async setReqStatus(id, status) {
            if (status === 'abandonnee' && !await SF.confirm('Abandonner cette demande ?', { okLabel: 'Abandonner' })) return;
            try { await SF.api('/api/client-requests/' + id, { method: 'PUT', body: { status } }); await this.load(); this.loadAnalysis(); }
            catch (e) { SF.toast(e.message, 'error'); }
        }
    };
    Rq.init();
    </script>
</body>
</html>

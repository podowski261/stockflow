<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Rapports & Suivi — STOCKFLOW</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sf.css">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('stockflow-theme') === 'dark' ? 'dark' : 'light'); try { var sfu = JSON.parse(localStorage.getItem('stockflow-ui') || '{}'); for (var k in sfu) document.documentElement.setAttribute('data-' + k, sfu[k]); } catch (e) {}</script>
    <style>
        .search-big { position:relative; max-width:560px; margin-bottom:18px; }
        .search-big input { width:100%; padding:14px 16px 14px 48px; background:var(--bg-card); border:2px solid var(--accent); border-radius:var(--border-radius); font-size:15px; color:var(--text-primary); font-family:var(--font-body); }
        .search-big input:focus { outline:none; box-shadow:0 0 0 3px var(--accent-glow); }
        .search-big i { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--accent-contrast); background:var(--accent); width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; }
        .res-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border-color); border-radius:12px; margin-bottom:8px; cursor:pointer; transition:border-color .12s, transform .1s; }
        .res-item:hover { border-color:var(--accent); transform:translateX(2px); }
        .res-serial { font-family:monospace; font-weight:700; color:var(--text-primary); }
        .timeline { position:relative; padding-left:28px; }
        .timeline::before { content:''; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border-color); }
        .tl-item { position:relative; padding:0 0 18px; }
        .tl-dot { position:absolute; left:-24px; top:2px; width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid var(--bg-card); }
        .tl-action { font-weight:700; color:var(--text-primary); font-size:13.5px; }
        .tl-meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
        .empty { text-align:center; color:var(--text-muted); padding:40px; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sfSidebar"></aside>
        <main class="main-content">
            <header class="page-header">
                <div class="page-title"><h1>Rapports & Suivi</h1><p>Retracez le parcours d'un produit</p></div>
                <div class="page-actions"><div id="sfTools"></div></div>
            </header>
            <div class="page-body">
                <div class="search-big"><i class="fas fa-magnifying-glass"></i><input type="text" id="q" placeholder="Numéro de série ou modèle…" autocomplete="off" autofocus></div>
                <div id="results"></div>
            </div>
        </main>
    </div>

    <!-- Modale parcours -->
    <div class="modal-overlay" id="tlModal">
        <div class="modal" style="max-width:620px;">
            <div class="modal-header"><h3 id="tlTitle">Parcours</h3><button class="modal-close" onclick="SF.Modal.close('tlModal')">&times;</button></div>
            <div class="modal-body" id="tlBody"></div>
        </div>
    </div>

    <script src="/js/sf-core.js"></script>
    <script src="/js/sf-layout.js"></script>
    <script>
    const Reports = {
        _t: null,
        actionLabels: {
            reception: 'Réception', envoi_installation: 'Envoi en installation', installation_terminee: 'Installation terminée',
            retour_garantie: 'Retour en garantie', presentoir: 'Mise en présentoir', presentoir_retrait: 'Retrait présentoir',
            vente: 'Vendu', vente_echange: 'Vendu (échange)', retour_vente: 'Retour de vente', echange_retour: 'Retour pour échange',
            retour_fournisseur: 'Retour au fournisseur', garantie_traitee: 'Garantie traitée', garantie_reparee: 'Réparé',
            remplace: 'Remplacé', supprime: 'Supprimé', livraison_facturee: 'Livraison facturée', livraison_sortie: 'Sortie du stock (livraison)',
            livraison_livree: 'Livrée', livraison_retour: 'Retour livraison'
        },
        async init() {
            const u = await SF.Auth.require(['gestion_stock']); if (!u) return;
            SF.layout({ active: '/reports.html' });
            document.getElementById('q').addEventListener('input', () => { clearTimeout(this._t); this._t = setTimeout(() => this.search(), 300); });
            // Scanner physique actif sur toute la page → recherche + ouverture directe.
            SF.Scanner.init(code => this.scanSearch(code));
        },
        async scanSearch(code) {
            document.getElementById('q').value = code;
            await this.search();
            try {
                const rows = await SF.api('/api/suivi/search?q=' + encodeURIComponent(code));
                const exact = rows.find(r => r.serial === code) || (rows.length === 1 ? rows[0] : null);
                if (exact) this.open(exact.id);
            } catch (e) {}
        },
        async search() {
            const q = document.getElementById('q').value.trim();
            const box = document.getElementById('results');
            if (!q) { box.innerHTML = ''; return; }
            try {
                const rows = await SF.api('/api/suivi/search?q=' + encodeURIComponent(q));
                if (!rows.length) { box.innerHTML = '<div class="empty">Aucun résultat</div>'; return; }
                box.innerHTML = rows.map(r => `<div class="res-item" onclick="Reports.open(${r.id})">
                    <div class="quick-icon" style="width:40px;height:40px;border-radius:11px;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;"><i class="fas fa-barcode"></i></div>
                    <div style="flex:1;"><div class="res-serial">${SF.esc(r.serial)}</div><div class="text-muted" style="font-size:12.5px;">${SF.esc([r.brand, r.model].filter(Boolean).join(' ') || r.product_name || '')}</div></div>
                    <div style="text-align:right;">${SF.statusBadge(r.status)}<div class="text-muted" style="font-size:11px;margin-top:3px;">${SF.esc(r.supplier_name || '')}</div></div>
                </div>`).join('');
            } catch (e) { SF.toast(e.message, 'error'); }
        },
        async open(id) {
            try {
                const u = await SF.api('/api/suivi/unit/' + id);
                document.getElementById('tlTitle').textContent = `Parcours — ${u.serial}`;
                const spec = [u.cpu, u.ram, u.storage ? u.storage + (u.storage_type ? ' ' + u.storage_type : '') : ''].filter(Boolean).join(' · ');
                const tl = (u.movements || []).map(m => `<div class="tl-item"><div class="tl-dot"></div>
                    <div class="tl-action">${this.actionLabels[m.action] || m.action} → ${SF.UNIT_STATUS[m.to_status] || m.to_status}</div>
                    <div class="tl-meta">${SF.fmt.datetime(m.created_at)} · ${SF.esc(m.user_name || '')}${m.note ? ' · ' + SF.esc(m.note) : ''}</div></div>`).join('');
                document.getElementById('tlBody').innerHTML = `
                    <div style="background:var(--bg-input);border-radius:12px;padding:14px;margin-bottom:18px;font-size:13px;line-height:1.7;">
                        <div style="font-weight:700;font-size:15px;color:var(--text-primary);">${SF.esc([u.brand, u.model].filter(Boolean).join(' ') || u.product_name)}</div>
                        <div class="text-muted">${SF.esc((u.category || '') + (spec ? ' · ' + spec : ''))}</div>
                        ${u.manufacturer_sn ? `<div style="margin-top:4px;font-family:monospace;font-size:12.5px;">N° série constructeur : <strong>${SF.esc(u.manufacturer_sn)}</strong></div>` : ''}
                        <div style="margin-top:6px;">Statut actuel : ${SF.statusBadge(u.status)} · Fournisseur : ${SF.esc(u.supplier_name || '—')}</div>
                        <div>Garantie : ${SF.warrantyBadge(u.warranty_end)}${u.sale ? ` · Vente #${u.sale.sale_number} (${SF.fmt.ar(u.sale.total)})` : ''}</div>
                    </div>
                    <h4 style="margin-bottom:12px;">Historique (${(u.movements || []).length} étapes)</h4>
                    ${tl ? `<div class="timeline">${tl}</div>` : '<div class="text-muted">Aucun mouvement</div>'}`;
                SF.Modal.open('tlModal');
            } catch (e) { SF.toast(e.message, 'error'); }
        }
    };
    Reports.init();
    </script>
</body>
</html>
